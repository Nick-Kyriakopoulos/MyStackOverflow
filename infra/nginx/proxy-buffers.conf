# NextAuth stores the Keycloak access, refresh and id tokens inside its session
# cookie, so the callback response carries several kilobytes of Set-Cookie.
# nginx's default proxy buffers are 4-8k, and anything larger makes it drop the
# upstream response with "upstream sent too big header" - surfacing as a 502 at
# the exact moment a login completes.
proxy_buffer_size   16k;
proxy_buffers       8 16k;
proxy_busy_buffers_size 32k;

# The matching limit for requests coming back in with those large cookies.
large_client_header_buffers 4 16k;
