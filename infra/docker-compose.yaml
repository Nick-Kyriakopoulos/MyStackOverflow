services:
  production-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "8080:18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  keycloak:
    image: "quay.io/keycloak/keycloak:26.5"
    command:
      - "start"
      - "--import-realm"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_PASSWORD}"
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES: "opentelemetry"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      VIRTUAL_HOST: "id.MyStackOverflow.local"
      VIRTUAL_PORT: "8080"
      KC_HOSTNAME: "https://id.MyStackOverflow.local"
      KC_PROXY_HEADERS: "xforwarded"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://production-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "keycloak"
    expose:
      - "8080"
      - "9000"
    volumes:
      - type: "volume"
        target: "/opt/keycloak/data"
        source: "keycloak-data"
        read_only: false
      - type: "bind"
        target: "/opt/keycloak/data/import"
        source: "${KEYCLOAK_BINDMOUNT_0}"
        read_only: true
    networks:
      - "aspire"
  postgres:
    image: "docker.io/library/postgres:17.6"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql/data"
        source: "postgres-data"
        read_only: false
    networks:
      - "aspire"
  typesense:
    image: "typesense/typesense:29.0"
    environment:
      TYPESENSE_DATA_DIR: "/data"
      TYPESENSE_ENABLE_CORS: "true"
      TYPESENSE_API_KEY: "${TYPESENSE_API_KEY}"
    expose:
      - "8108"
    volumes:
      - type: "volume"
        target: "/data"
        source: "typesense-data"
        read_only: false
    networks:
      - "aspire"
  messaging:
    image: "docker.io/library/rabbitmq:4.2-management"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "${MESSAGING_PASSWORD}"
    expose:
      - "5672"
      - "15672"
    volumes:
      - type: "volume"
        target: "/var/lib/rabbitmq"
        source: "rabbitmq-data"
        read_only: false
    networks:
      - "aspire"
  question-svc:
    image: "${QUESTION_SVC_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${QUESTION_SVC_PORT}"
      KEYCLOAK_HTTP: "http://keycloak:8080"
      services__keycloak__http__0: "http://keycloak:8080"
      ConnectionStrings__questionDb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=questionDb"
      QUESTIONDB_HOST: "postgres"
      QUESTIONDB_PORT: "5432"
      QUESTIONDB_USERNAME: "postgres"
      QUESTIONDB_PASSWORD: "${POSTGRES_PASSWORD}"
      QUESTIONDB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/questionDb"
      QUESTIONDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/questionDb"
      QUESTIONDB_DATABASENAME: "questionDb"
      ConnectionStrings__messaging: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      MESSAGING_HOST: "messaging"
      MESSAGING_PORT: "5672"
      MESSAGING_USERNAME: "guest"
      MESSAGING_PASSWORD: "${MESSAGING_PASSWORD}"
      MESSAGING_URI: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://production-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "question-svc"
    expose:
      - "${QUESTION_SVC_PORT}"
    depends_on:
      keycloak:
        condition: "service_started"
      postgres:
        condition: "service_started"
      messaging:
        condition: "service_started"
    networks:
      - "aspire"
  search-svc:
    image: "${SEARCH_SVC_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${SEARCH_SVC_PORT}"
      typesense-api-key: "${TYPESENSE_API_KEY}"
      TYPESENSE_TYPESENSE: "http://typesense:8108"
      services__typesense__typesense__0: "http://typesense:8108"
      ConnectionStrings__messaging: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      MESSAGING_HOST: "messaging"
      MESSAGING_PORT: "5672"
      MESSAGING_USERNAME: "guest"
      MESSAGING_PASSWORD: "${MESSAGING_PASSWORD}"
      MESSAGING_URI: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://production-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "search-svc"
    expose:
      - "${SEARCH_SVC_PORT}"
    depends_on:
      messaging:
        condition: "service_started"
      typesense:
        condition: "service_started"
    networks:
      - "aspire"
  gateway:
    image: "mcr.microsoft.com/dotnet/nightly/yarp:2.3-preview"
    command:
      - "/app/yarp.dll"
    entrypoint:
      - "dotnet"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      QUESTION_SVC_HTTP: "http://question-svc:${QUESTION_SVC_PORT}"
      REVERSEPROXY__ROUTES__route0__MATCH__PATH: "/questions/{**catch-all}"
      REVERSEPROXY__ROUTES__route0__CLUSTERID: "cluster_question-svc"
      REVERSEPROXY__ROUTES__route1__MATCH__PATH: "/test/{**catch-all}"
      REVERSEPROXY__ROUTES__route1__CLUSTERID: "cluster_question-svc"
      REVERSEPROXY__ROUTES__route2__MATCH__PATH: "/tags/{**catch-all}"
      REVERSEPROXY__ROUTES__route2__CLUSTERID: "cluster_question-svc"
      REVERSEPROXY__ROUTES__route3__MATCH__PATH: "/search/{**catch-all}"
      REVERSEPROXY__ROUTES__route3__CLUSTERID: "cluster_search-svc"
      REVERSEPROXY__CLUSTERS__cluster_question-svc__DESTINATIONS__destination1__ADDRESS: "https+http://question-svc"
      REVERSEPROXY__CLUSTERS__cluster_search-svc__DESTINATIONS__destination1__ADDRESS: "https+http://search-svc"
      services__question-svc__http__0: "http://question-svc:${QUESTION_SVC_PORT}"
      QUESTION_SVC_HTTPS: "https://question-svc:${QUESTION_SVC_PORT}"
      SEARCH_SVC_HTTP: "http://search-svc:${SEARCH_SVC_PORT}"
      services__search-svc__http__0: "http://search-svc:${SEARCH_SVC_PORT}"
      SEARCH_SVC_HTTPS: "https://search-svc:${SEARCH_SVC_PORT}"
      VIRTUAL_HOST: "api.MyStackOverflow.local"
      VIRTUAL_PORT: "8001"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://production-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "gateway"
    expose:
      - "5000"
    networks:
      - "aspire"
  webapp:
    image: "${WEBAPP_IMAGE}"
    environment:
      NODE_ENV: "production"
      KEYCLOAK_HTTP: "http://keycloak:8080"
      services__keycloak__http__0: "http://keycloak:8080"
      PORT: "3000"
      AUTH_KEYCLOACK_ISSUER: "https://id.MyStackOverflow.local/realms/MyStackOverflow"
      AUTH_KEYCLOACK_ID: "Next JS Client"
      AUTH_KEYCLOACK_SECRET: "${KEYCLOAK_CLIENT_SECRET}"
      AUTH_KEYCLOACK_ADMIN_CLIENT_ID: "webapp-admin"
      AUTH_KEYCLOACK_ADMIN_CLIENT_SECRET: "${KEYCLOAK_ADMIN_CLIENT_SECRET}"
      AUTH_SECRET: "${AUTH_SECRET}"
      AUTH_URL: "https://app.MyStackOverflow.local"
      NODE_EXTRA_CA_CERTS: "/etc/ssl/local/id.MyStackOverflow.local.crt"
      API_URL: "http://gateway:8001"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"
      VIRTUAL_HOST: "app.MyStackOverflow.local"
      VIRTUAL_PORT: "3000"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://production-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "webapp"
    expose:
      - "3000"
    volumes:
      - type: "bind"
        target: "/etc/ssl/local"
        source: "${NGINX_PROXY_BINDMOUNT_0}"
        read_only: true
    networks:
      - "aspire"
    links:
      - "nginx-proxy:id.MyStackOverflow.local"
  nginx-proxy:
    image: "nginxproxy/nginx-proxy:1.10"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: "bind"
        target: "/tmp/docker.sock"
        source: "/var/run/docker.sock"
        read_only: true
      - type: "bind"
        target: "/etc/nginx/certs"
        source: "${NGINX_PROXY_BINDMOUNT_0}"
        read_only: true
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  keycloak-data:
    driver: "local"
  postgres-data:
    driver: "local"
  typesense-data:
    driver: "local"
  rabbitmq-data:
    driver: "local"
